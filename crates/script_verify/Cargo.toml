[package]
name = "bdk_script_verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
homepage = "https://bitcoindevkit.org"
repository = "https://github.com/bitcoindevkit/bdk"
documentation = "https://docs.rs/bdk_script_verify"
description = "Pure-Rust Bitcoin input script and witness verification."
license = "MIT OR Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[dependencies]
bitcoin = { version = "0.32.0", default-features = false }

[dev-dependencies]
bitcoin = { version = "0.32.0", features = ["rand-std"] }
bitcoinkernel = "=0.3.2"
# Pinned because this crate vendors the Core source the oracle runs, which the tests name.
libbitcoinkernel-sys = "=0.4.1"
miniscript = { version = "13.0.0", features = ["compiler"] }
proptest = "1.2.0"
serde_json = "1"

[features]
default = ["std"]
std = ["bitcoin/std"]
