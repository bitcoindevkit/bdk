name: Changelog notice

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the changelog notice in the PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | python3 ci/changelog.py check
